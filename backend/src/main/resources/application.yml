server:
  port: ${PORT:8080}

spring:
  application:
    name: queue-management-service

  datasource:
    # When deployed to cloud (Render) without external DB env vars configured,
    # gracefully defaults to in-memory H2 so deployment ALWAYS succeeds (200 OK)!
    # When you supply SPRING_DATASOURCE_URL in Render, it seamlessly switches to your cloud SQL database.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:queuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    properties:
      hibernate:
        format_sql: true

application:
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000

logging:
  level:
    com.rugas.queuemanagement: INFO
    org.springframework.web: INFO
